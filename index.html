<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catcher</title>
<meta name="theme-color" content="#f4f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catcher">
<link rel="manifest" href="./manifest.json">
<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #0f1b3d;
  --muted: #6b7794;
  --line: #e3e9f3;
  --accent: #06b6d4;
  --accent-soft: rgba(6,182,212,0.12);
  --chip: #eef3fa;
  --endbg: #0f1b3d;
  --endtext: #ffffff;
  --green: #16a34a;
  --red: #dc2626;
  --amber: #d97706;
  --shadow: 0 4px 18px rgba(15,27,61,0.07);
}
html[data-theme="dark"] {
  --bg: #0a0e1a;
  --card: #141c2e;
  --text: #e8f0ff;
  --muted: #8b9bbd;
  --line: #22304d;
  --accent: #22d3ee;
  --accent-soft: rgba(34,211,238,0.14);
  --chip: #1b2640;
  --endbg: #1e2d52;
  --endtext: #e8f0ff;
  --green: #4ade80;
  --red: #f87171;
  --amber: #fbbf24;
  --shadow: 0 4px 18px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  transition: background 0.2s, color 0.2s;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 16px 40px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.theme-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow);
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.tabs { display: flex; background: var(--chip); border-radius: 16px; padding: 4px; margin-bottom: 16px; }
.tab {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  font-size: 15px; font-weight: 700; padding: 10px 0; border-radius: 12px; cursor: pointer;
  font-family: inherit;
}
.tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.dateline { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 4px 12px; }
.ftabs { display: flex; gap: 8px; margin-bottom: 14px; }
.ftab {
  flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 16px; padding: 10px 4px; cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.ftab .fl { font-size: 14px; font-weight: 700; }
.ftab .fc { font-size: 12px; color: var(--muted); font-weight: 600; }
.ftab.active { border-color: var(--accent); background: var(--accent-soft); }
.ftab.active .fl { color: var(--accent); }
.card {
  background: var(--card); border-radius: 20px; padding: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 16px;
}
.sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.sec-title { font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
.sec-prog { font-size: 13px; font-weight: 700; color: var(--muted); }
.bar { height: 6px; background: var(--chip); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.25s; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.off { opacity: 0.45; }
.chk {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px;
  border: 2px solid var(--accent); background: transparent; color: #fff;
  font-size: 16px; font-weight: 800; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center; font-family: inherit;
}
.chk.on { background: var(--accent); }
.chk:disabled { border-color: var(--line); cursor: default; }
.rt { flex: 1; min-width: 0; }
.txt { font-size: 16px; font-weight: 600; word-wrap: break-word; overflow-wrap: anywhere; }
.txt.strike { text-decoration: line-through; color: var(--muted); }
.pill {
  display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 10px;
  background: var(--chip); color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.6px;
}
.del {
  width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; border: 0;
  background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0; font-family: inherit;
}
.empty { text-align: center; color: var(--muted); padding: 18px 0; font-size: 14px; }
.addform { margin-top: 12px; padding-top: 14px; border-top: 1px dashed var(--line); }
.inp {
  width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  border-radius: 14px; padding: 12px 14px; font-size: 16px; font-family: inherit; outline: none;
}
.inp:focus { border-color: var(--accent); }
.days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.day {
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 14px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.day.on { background: var(--accent); border-color: var(--accent); color: #06222a; }
.saving { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.saving b { color: var(--text); }
.add-btn {
  width: 100%; margin-top: 12px; border: 0; border-radius: 14px; padding: 13px;
  background: var(--accent); color: #06222a; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
}
.end-btn {
  width: 100%; border: 0; border-radius: 20px; padding: 18px;
  background: var(--endbg); color: var(--endtext); font-size: 17px; font-weight: 800;
  cursor: pointer; box-shadow: var(--shadow); font-family: inherit;
}
.rec-date { font-size: 17px; font-weight: 800; }
.rec-sum { font-size: 13px; color: var(--muted); margin: 4px 0 10px; font-weight: 600; }
.rec-label { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 4px; }
.rec-label.g { color: var(--green); }
.rec-label.r { color: var(--red); }
.rec-label.a { color: var(--amber); }
.rec ul { margin: 0; padding-left: 20px; }
.rec li { margin: 3px 0; font-size: 15px; overflow-wrap: anywhere; }
.copy-btn {
  margin-top: 14px; width: 100%; border: 1px solid var(--accent); background: var(--accent-soft);
  color: var(--accent); border-radius: 14px; padding: 11px; font-size: 15px; font-weight: 800;
  cursor: pointer; font-family: inherit;
}
.hidden { display: none !important; }
.sig {
  text-align: right; margin-top: 28px; padding-right: 4px; color: var(--muted);
  font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", "Snell Roundhand", cursive;
  font-size: 24px;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><span class="brand-icon">☑️</span><span>Catcher</span></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabToday" type="button">Today</button>
    <button class="tab" id="tabHistory" type="button">History</button>
  </div>

  <div id="viewToday">
    <div class="dateline" id="dateLine"></div>
    <div class="ftabs">
      <button class="ftab active" type="button" data-freq="daily"><span class="fl">Daily</span><span class="fc" id="cnt-daily">0/0</span></button>
      <button class="ftab" type="button" data-freq="weekly"><span class="fl">Weekly</span><span class="fc" id="cnt-weekly">0/0</span></button>
      <button class="ftab" type="button" data-freq="monthly"><span class="fl">Monthly</span><span class="fc" id="cnt-monthly">0/0</span></button>
    </div>

    <div class="card">
      <div class="sec-head">
        <span class="sec-title" id="secTitle">Daily</span>
        <span class="sec-prog" id="secProg">0 / 0</span>
      </div>
      <div class="bar"><div id="barFill" style="width:0%"></div></div>
      <div id="list"></div>

      <div class="addform">
        <input class="inp" id="newText" type="text" maxlength="200" placeholder="Add a duty..." autocomplete="off">
        <div class="days" id="daysRow">
          <button class="day on" type="button" data-day="all">Every day</button>
          <button class="day" type="button" data-day="1">Mon</button>
          <button class="day" type="button" data-day="2">Tue</button>
          <button class="day" type="button" data-day="3">Wed</button>
          <button class="day" type="button" data-day="4">Thu</button>
          <button class="day" type="button" data-day="5">Fri</button>
        </div>
        <div class="saving" id="savingLine"></div>
        <button class="add-btn" id="addBtn" type="button">+ Add</button>
      </div>
    </div>

    <button class="end-btn" id="endBtn" type="button">🌙 End Day — Save Record</button>
  </div>

  <div id="viewHistory" class="hidden"></div>

  <div class="sig">Vuja Tsoaela</div>
</div>

<script>
var K_RESP = "dc_responsibilities";
var K_DONE = "dc_done";
var K_HIST = "dc_history";
var K_THEME = "dc_theme";

var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var DAY_SHORT = { "1": "Mon", "2": "Tue", "3": "Wed", "4": "Thu", "5": "Fri" };
var FREQ_LABEL = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" };

var activeView = "today";
var activeFreq = "daily";
var selDays = [];

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function load(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) { return fallback; }
    var v = JSON.parse(raw);
    return (v === null || v === undefined) ? fallback : v;
  } catch (e) { return fallback; }
}

function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

function getResp() {
  var r = load(K_RESP, []);
  return (r instanceof Array) ? r : [];
}

function getDone() {
  var d = load(K_DONE, {});
  if (!d || typeof d !== "object" || d instanceof Array) { d = {}; }
  if (!d.daily) { d.daily = {}; }
  if (!d.weekly) { d.weekly = {}; }
  if (!d.monthly) { d.monthly = {}; }
  return d;
}

function getHist() {
  var h = load(K_HIST, []);
  return (h instanceof Array) ? h : [];
}

function pad2(n) { return (n < 10 ? "0" : "") + n; }

function genId() {
  return "r_" + new Date().getTime() + "_" + Math.floor(Math.random() * 1000000).toString(36);
}

/* ---------- period keys ---------- */
function dailyKey(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function weeklyKey(d) {
  /* local calendar date converted to a day count, so time of day never matters.
     Epoch day 0 is a Thursday, so +3 makes the count roll over on Monday. */
  var days = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return String(Math.floor((days + 3) / 7));
}

function monthlyKey(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}

function keyFor(freq, d) {
  if (freq === "daily") { return dailyKey(d); }
  if (freq === "weekly") { return weeklyKey(d); }
  return monthlyKey(d);
}

function longDate(d) {
  return DAY_NAMES[d.getDay()] + ", " + d.getDate() + " " + MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
}

/* ---------- done state ---------- */
function isDone(duty, d) {
  var done = getDone();
  var arr = done[duty.freq][keyFor(duty.freq, d)];
  return !!(arr && arr.indexOf(duty.id) !== -1);
}

function appliesToday(duty, d) {
  if (duty.freq !== "daily") { return true; }
  if (!duty.days || duty.days.length === 0) { return true; }
  return duty.days.indexOf(String(d.getDay())) !== -1;
}

function dutiesFor(freq) {
  var all = getResp();
  var out = [];
  var i;
  for (i = 0; i < all.length; i++) {
    if (all[i].freq === freq) { out.push(all[i]); }
  }
  return out;
}

function toggleDone(id) {
  var d = new Date();
  var all = getResp();
  var duty = null;
  var i;
  for (i = 0; i < all.length; i++) {
    if (all[i].id === id) { duty = all[i]; break; }
  }
  if (!duty) { return; }
  var done = getDone();
  var key = keyFor(duty.freq, d);
  var arr = done[duty.freq][key];
  if (!arr) { arr = []; done[duty.freq][key] = arr; }
  var idx = arr.indexOf(id);
  if (idx === -1) { arr.push(id); } else { arr.splice(idx, 1); }
  save(K_DONE, done);
  render();
}

function deleteDuty(id) {
  var all = getResp();
  var next = [];
  var i;
  for (i = 0; i < all.length; i++) {
    if (all[i].id !== id) { next.push(all[i]); }
  }
  save(K_RESP, next);
  var done = getDone();
  var freqs = ["daily", "weekly", "monthly"];
  var f, k, idx;
  for (f = 0; f < freqs.length; f++) {
    for (k in done[freqs[f]]) {
      if (Object.prototype.hasOwnProperty.call(done[freqs[f]], k)) {
        idx = done[freqs[f]][k].indexOf(id);
        while (idx !== -1) {
          done[freqs[f]][k].splice(idx, 1);
          idx = done[freqs[f]][k].indexOf(id);
        }
      }
    }
  }
  save(K_DONE, done);
  render();
}

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").textContent = (t === "dark") ? "☀️" : "🌙";
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) { meta.setAttribute("content", t === "dark" ? "#0a0e1a" : "#f4f7fb"); }
}

function initTheme() {
  var t = null;
  try { t = localStorage.getItem(K_THEME); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = "light";
    try {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) { t = "dark"; }
    } catch (e2) {}
  }
  applyTheme(t);
}

function toggleTheme() {
  var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  var next = (cur === "dark") ? "light" : "dark";
  try { localStorage.setItem(K_THEME, next); } catch (e) {}
  applyTheme(next);
}

/* ---------- rendering: today ---------- */
function stats(freq, d) {
  var list = dutiesFor(freq);
  var total = 0, done = 0, i;
  for (i = 0; i < list.length; i++) {
    if (appliesToday(list[i], d)) {
      total++;
      if (isDone(list[i], d)) { done++; }
    }
  }
  return { done: done, total: total };
}

function renderToday() {
  var d = new Date();
  $("dateLine").textContent = longDate(d);

  var freqs = ["daily", "weekly", "monthly"];
  var i, s;
  for (i = 0; i < freqs.length; i++) {
    s = stats(freqs[i], d);
    $("cnt-" + freqs[i]).textContent = s.done + "/" + s.total;
  }

  var ftabs = document.querySelectorAll(".ftab");
  for (i = 0; i < ftabs.length; i++) {
    if (ftabs[i].getAttribute("data-freq") === activeFreq) {
      ftabs[i].className = "ftab active";
    } else {
      ftabs[i].className = "ftab";
    }
  }

  s = stats(activeFreq, d);
  $("secTitle").textContent = FREQ_LABEL[activeFreq];
  $("secProg").textContent = s.done + " / " + s.total;
  $("barFill").style.width = (s.total ? Math.round(s.done / s.total * 100) : 0) + "%";

  var list = dutiesFor(activeFreq);
  var html = "";
  var duty, app, done, pill, j, labels;
  for (i = 0; i < list.length; i++) {
    duty = list[i];
    app = appliesToday(duty, d);
    done = app && isDone(duty, d);
    pill = "";
    if (duty.freq === "daily") {
      if (!duty.days || duty.days.length === 0) {
        pill = "EVERY DAY";
      } else {
        labels = [];
        for (j = 0; j < duty.days.length; j++) {
          if (DAY_SHORT[duty.days[j]]) { labels.push(DAY_SHORT[duty.days[j]].toUpperCase()); }
        }
        pill = labels.join(", ");
      }
    }
    html += '<div class="row' + (app ? "" : " off") + '">' +
      '<button type="button" class="chk' + (done ? " on" : "") + '" data-id="' + escapeHtml(duty.id) + '" aria-label="Mark done"' + (app ? "" : " disabled") + '>' + (done ? "✓" : "") + '</button>' +
      '<div class="rt"><div class="txt' + (done ? " strike" : "") + '">' + escapeHtml(duty.text) + '</div>' +
      (pill ? '<span class="pill">' + escapeHtml(pill) + '</span>' : "") + '</div>' +
      '<button type="button" class="del" data-id="' + escapeHtml(duty.id) + '" aria-label="Delete duty">×</button>' +
      '</div>';
  }
  if (!list.length) {
    html = '<div class="empty">No ' + escapeHtml(activeFreq) + ' duties yet. Add one below.</div>';
  }
  $("list").innerHTML = html;

  var chks = $("list").querySelectorAll(".chk");
  var dels = $("list").querySelectorAll(".del");
  for (i = 0; i < chks.length; i++) {
    chks[i].addEventListener("click", onCheckClick);
  }
  for (i = 0; i < dels.length; i++) {
    dels[i].addEventListener("click", onDeleteClick);
  }

  renderDaysUi();
}

function onCheckClick(e) {
  toggleDone(e.currentTarget.getAttribute("data-id"));
}

function onDeleteClick(e) {
  deleteDuty(e.currentTarget.getAttribute("data-id"));
}

function sortedDays() {
  var out = selDays.slice(0);
  out.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
  return out;
}

function renderDaysUi() {
  var row = $("daysRow");
  if (activeFreq === "daily") { row.className = "days"; } else { row.className = "days hidden"; }

  var btns = row.querySelectorAll(".day");
  var i, v, on;
  for (i = 0; i < btns.length; i++) {
    v = btns[i].getAttribute("data-day");
    on = (v === "all") ? (selDays.length === 0) : (selDays.indexOf(v) !== -1);
    btns[i].className = on ? "day on" : "day";
  }

  var line = $("savingLine");
  line.textContent = "";
  var label = "Every day";
  if (activeFreq === "daily" && selDays.length) {
    var names = [], sd = sortedDays();
    for (i = 0; i < sd.length; i++) { names.push(DAY_SHORT[sd[i]]); }
    label = names.join(", ");
  } else if (activeFreq !== "daily") {
    label = FREQ_LABEL[activeFreq];
  }
  line.appendChild(document.createTextNode("Saving as: "));
  var b = document.createElement("b");
  b.textContent = label;
  line.appendChild(b);
}

function onDayClick(e) {
  var v = e.currentTarget.getAttribute("data-day");
  if (v === "all") {
    selDays = [];
  } else {
    var idx = selDays.indexOf(v);
    if (idx === -1) { selDays.push(v); } else { selDays.splice(idx, 1); }
  }
  renderDaysUi();
}

function addDuty() {
  var inp = $("newText");
  var text = inp.value.replace(/^\s+|\s+$/g, "");
  if (!text) { inp.focus(); return; }
  var duty = {
    id: genId(),
    text: text,
    freq: activeFreq,
    days: (activeFreq === "daily") ? sortedDays() : [],
    created: new Date().getTime()
  };
  var all = getResp();
  all.push(duty);
  save(K_RESP, all);
  inp.value = "";
  render();
}

/* ---------- end day ---------- */
function endDay() {
  var d = new Date();
  var all = getResp();
  var done = [], missed = [], open = [];
  var i, duty, suffix;
  for (i = 0; i < all.length; i++) {
    duty = all[i];
    if (duty.freq === "daily") {
      if (!appliesToday(duty, d)) { continue; }
      if (isDone(duty, d)) { done.push(duty.text); } else { missed.push(duty.text); }
    } else {
      suffix = " (" + duty.freq + ")";
      if (isDone(duty, d)) { done.push(duty.text + suffix); } else { open.push(duty.text + suffix); }
    }
  }
  var rec = {
    id: "h_" + d.getTime() + "_" + Math.floor(Math.random() * 100000).toString(36),
    dateLabel: longDate(d),
    done: done,
    missed: missed,
    open: open,
    saved: d.getTime()
  };
  var hist = getHist();
  hist.unshift(rec);
  if (hist.length > 365) { hist = hist.slice(0, 365); }
  save(K_HIST, hist);
  setView("history");
}

/* ---------- rendering: history ---------- */
function listHtml(label, cls, items) {
  if (!items || !items.length) { return ""; }
  var h = '<div class="rec-label ' + cls + '">' + escapeHtml(label) + " (" + items.length + ")</div><ul>";
  var i;
  for (i = 0; i < items.length; i++) { h += "<li>" + escapeHtml(items[i]) + "</li>"; }
  return h + "</ul>";
}

function renderHistory() {
  var hist = getHist();
  var box = $("viewHistory");
  var html = "";
  var i, r;
  for (i = 0; i < hist.length; i++) {
    r = hist[i];
    html += '<div class="card rec">' +
      '<div class="rec-date">' + escapeHtml(r.dateLabel) + '</div>' +
      '<div class="rec-sum">' + r.done.length + ' completed · ' + r.missed.length + ' missed · ' + r.open.length + ' still open</div>' +
      listHtml("Completed", "g", r.done) +
      listHtml("Missed", "r", r.missed) +
      listHtml("Still Open", "a", r.open) +
      '<button type="button" class="copy-btn" data-id="' + escapeHtml(r.id) + '">Copy record</button>' +
      '</div>';
  }
  if (!hist.length) {
    html = '<div class="card"><div class="empty">No records yet. Tap "End Day" on the Today tab to save your first one.</div></div>';
  }
  box.innerHTML = html;
  var btns = box.querySelectorAll(".copy-btn");
  for (i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", onCopyClick);
  }
}

function recordText(r) {
  var lines = [];
  var i;
  lines.push("Work record: " + r.dateLabel);
  lines.push(r.done.length + " completed, " + r.missed.length + " missed, " + r.open.length + " still open");
  if (r.done.length) {
    lines.push("");
    lines.push("COMPLETED");
    for (i = 0; i < r.done.length; i++) { lines.push("- " + r.done[i]); }
  }
  if (r.missed.length) {
    lines.push("");
    lines.push("MISSED");
    for (i = 0; i < r.missed.length; i++) { lines.push("- " + r.missed[i]); }
  }
  if (r.open.length) {
    lines.push("");
    lines.push("STILL OPEN");
    for (i = 0; i < r.open.length; i++) { lines.push("- " + r.open[i]); }
  }
  return lines.join("\n");
}

function fallbackCopy(text) {
  var ok = false;
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.top = "0";
  ta.style.left = "0";
  ta.style.opacity = "0";
  ta.style.fontSize = "16px";
  document.body.appendChild(ta);
  try {
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
  } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function copyText(text, cb) {
  var nav = window.navigator;
  if (nav && nav.clipboard && nav.clipboard.writeText) {
    try {
      nav.clipboard.writeText(text).then(
        function () { cb(true); },
        function () { cb(fallbackCopy(text)); }
      );
      return;
    } catch (e) {}
  }
  cb(fallbackCopy(text));
}

function onCopyClick(e) {
  var btn = e.currentTarget;
  var id = btn.getAttribute("data-id");
  var hist = getHist();
  var rec = null, i;
  for (i = 0; i < hist.length; i++) {
    if (hist[i].id === id) { rec = hist[i]; break; }
  }
  if (!rec) { return; }
  copyText(recordText(rec), function (ok) {
    btn.textContent = ok ? "Copied ✓" : "Copy failed";
    setTimeout(function () { btn.textContent = "Copy record"; }, 1800);
  });
}

/* ---------- views ---------- */
function setView(v) {
  activeView = v;
  render();
}

function render() {
  if (activeView === "today") {
    $("viewToday").className = "";
    $("viewHistory").className = "hidden";
    $("tabToday").className = "tab active";
    $("tabHistory").className = "tab";
    renderToday();
  } else {
    $("viewToday").className = "hidden";
    $("viewHistory").className = "";
    $("tabToday").className = "tab";
    $("tabHistory").className = "tab active";
    renderHistory();
  }
}

/* ---------- init ---------- */
function init() {
  initTheme();

  $("themeBtn").addEventListener("click", toggleTheme);
  $("tabToday").addEventListener("click", function () { setView("today"); });
  $("tabHistory").addEventListener("click", function () { setView("history"); });
  $("addBtn").addEventListener("click", addDuty);
  $("endBtn").addEventListener("click", endDay);
  $("newText").addEventListener("keydown", function (e) {
    if (e.keyCode === 13 || e.key === "Enter") { e.preventDefault(); addDuty(); }
  });

  var ftabs = document.querySelectorAll(".ftab");
  var i;
  for (i = 0; i < ftabs.length; i++) {
    ftabs[i].addEventListener("click", function (e) {
      activeFreq = e.currentTarget.getAttribute("data-freq");
      render();
    });
  }
  var dayBtns = $("daysRow").querySelectorAll(".day");
  for (i = 0; i < dayBtns.length; i++) {
    dayBtns[i].addEventListener("click", onDayClick);
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { render(); }
  });

  render();

  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  } catch (e) {}
}

init();
</script>
