<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="A personal work responsibility recorder">
<title>Catcher</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  (function () {
    try {
      var t = localStorage.getItem("dc_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<style>
  /* ---------- Reset & base ---------- */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Rajdhani', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1rem;
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    transition: background 0.4s ease, color 0.4s ease;
    min-height: 100vh;
    letter-spacing: 0.3px;
    position: relative;
    overflow-x: hidden;
  }

  /* Animus ambient glow effect */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 0%, var(--ambient-glow) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
    transition: background 0.4s ease;
  }

  /* ---------- Theme Tokens ---------- */
  :root {
    --bg-gradient: linear-gradient(160deg, #f0f4f8 0%, #dbe3ec 100%);
    --ambient-glow: rgba(6, 182, 212, 0.08);
    --surface: rgba(255, 255, 255, 0.92);
    --surface-solid: #ffffff;
    --surface-soft: rgba(248, 250, 252, 0.9);
    --border: #dbe3ec;
    --border-glow: rgba(6, 182, 212, 0.3);
    --text: #0f172a;
    --text-dim: #64748b;
    --text-mute: #94a3b8;
    --accent: #06b6d4;
    --accent-deep: #0891b2;
    --accent-soft: rgba(6, 182, 212, 0.12);
    --priority-high: #ef4444;
    --priority-med: #f59e0b;
    --priority-low: #10b981;
    --success: #10b981;
    --shadow-card: 0 6px 28px -8px rgba(15, 23, 42, 0.15);
    --shadow-glow: 0 0 20px rgba(6, 182, 212, 0.15);
  }

  [data-theme="dark"] {
    --bg-gradient: linear-gradient(160deg, #0a0e1a 0%, #050810 100%);
    --ambient-glow: rgba(34, 211, 238, 0.08);
    --surface: rgba(20, 28, 46, 0.85);
    --surface-solid: #141c2e;
    --surface-soft: rgba(15, 22, 38, 0.9);
    --border: #1e2a44;
    --border-glow: rgba(34, 211, 238, 0.4);
    --text: #e8f0ff;
    --text-dim: #8ba3c7;
    --text-mute: #566a8a;
    --accent: #22d3ee;
    --accent-deep: #0891b2;
    --accent-soft: rgba(34, 211, 238, 0.12);
    --priority-high: #f87171;
    --priority-med: #fbbf24;
    --priority-low: #34d399;
    --success: #34d399;
    --shadow-card: 0 6px 28px -8px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 24px rgba(34, 211, 238, 0.12);
  }

  /* ---------- Layout ---------- */
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 90vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding: 0 0.25rem;
    gap: 0.5rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.15rem;
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    box-shadow: 0 0 20px var(--border-glow);
    flex-shrink: 0;
    /* Angled shape for futuristic feel */
    clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
    transform: skewX(-8deg);
  }
  .brand-icon > * {
    transform: skewX(8deg);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .theme-toggle {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 1.05rem;
    transition: all 0.2s ease;
    font-family: inherit;
    padding: 0;
    color: var(--text);
    /* Angled shape */
    clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
    box-shadow: var(--shadow-card);
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-glow);
    color: var(--accent);
  }
  .theme-toggle:active { transform: scale(0.94); }

  /* ---------- View Tabs ---------- */
  .view-tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 0.9rem;
  }
  .view-tab {
    flex: 1;
    padding: 0.7rem 0.5rem;
    border: none;
    background: var(--surface-soft);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    position: relative;
  }
  .view-tab:first-child {
    clip-path: polygon(0% 0%, 100% 0%, 90% 100%, 0% 100%);
  }
  .view-tab:last-child {
    clip-path: polygon(10% 0%, 100% 0%, 100% 100%, 0% 100%);
  }
  .view-tab.active {
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    color: #fff;
    box-shadow: var(--shadow-glow);
  }

  /* ---------- Frequency Tabs ---------- */
  .freq-tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.9rem;
  }
  .freq-tab {
    flex: 1;
    padding: 0.65rem 0.4rem;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
  }
  .freq-tab.active {
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    color: #fff;
    border-color: transparent;
    box-shadow: var(--shadow-glow);
  }
  .freq-tab .count {
    display: block;
    font-size: 0.68rem;
    font-weight: 600;
    opacity: 0.85;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  /* ---------- Date Label ---------- */
  .date-label {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 0.9rem;
    text-transform: uppercase;
  }

  /* ---------- Section (Card) ---------- */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.75rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 100%);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.5rem 0.6rem;
    gap: 0.5rem;
  }

  .section-title {
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
  }

  .section-progress {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .section-progress.zero { color: var(--text-mute); }

  /* ---------- Task Row ---------- */
  .task {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.6rem;
    border-top: 1px solid var(--border);
    transition: background 0.2s ease;
  }
  .task:first-of-type { border-top: none; }
  .task:hover { background: var(--accent-soft); }

  .task-check {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    cursor: pointer;
    transition: all 0.25s ease;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 0.85rem;
    font-weight: 900;
    clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
  }
  .task.done .task-check {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
  }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }
  .task.done .task-text {
    color: var(--text-mute);
    text-decoration: line-through;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 0.68rem;
    color: var(--text-dim);
    font-weight: 600;
  }

  .day-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
  }

  .task-delete {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-mute);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    font-family: inherit;
    padding: 0;
  }
  .task-delete:hover {
    background: var(--accent-soft);
    color: var(--accent);
    box-shadow: 0 0 10px var(--border-glow);
  }

  /* ---------- Empty State ---------- */
  .empty-state {
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--text-mute);
    font-size: 0.85rem;
    letter-spacing: 0.5px;
  }
  .empty-state .big {
    font-size: 1.6rem;
    margin-bottom: 0.4rem;
    opacity: 0.5;
  }

  /* ---------- Add Form ---------- */
  .add-form {
    border-top: 1px solid var(--border);
    padding: 0.7rem 0.4rem 0.3rem;
  }

  .add-form input[type="text"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    outline: none;
    margin-bottom: 0.55rem;
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
    clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 100%);
  }
  .add-form input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--border-glow);
  }
  .add-form input[type="text"]::placeholder { color: var(--text-mute); }

  .add-actions {
    display: flex;
    justify-content: flex-end;
  }
  .add-submit {
    padding: 0.65rem 1.2rem;
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 15px var(--border-glow);
    letter-spacing: 1px;
    text-transform: uppercase;
    clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
  }
  .add-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 25px var(--border-glow);
  }
  .add-submit:active { transform: scale(0.97); }

  /* ---------- End Day Button ---------- */
  .end-day-btn {
    width: 100%;
    padding: 1.1rem;
    margin-top: 0.5rem;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-transform: uppercase;
    clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
  }
  .end-day-btn:hover {
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
    transform: translateY(-1px);
  }
  .end-day-btn:active { transform: scale(0.98); }
  [data-theme="dark"] .end-day-btn {
    background: linear-gradient(135deg, #22d3ee, #3b82f6);
  }

  /* ---------- History Items ---------- */
  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem 1.1rem;
    margin-bottom: 0.7rem;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 100%);
  }
  .history-date {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.15rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .history-summary {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .history-block {
    font-size: 0.8rem;
    margin-bottom: 0.55rem;
  }
  .history-block:last-child { margin-bottom: 0; }
  .history-block .label {
    display: block;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.25rem;
  }
  .history-block ul {
    margin: 0;
    padding-left: 1.05rem;
  }
  .history-block li {
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.6;
    letter-spacing: 0.3px;
  }
  .history-block.done .label { color: var(--success); }
  .history-block.missed .label { color: var(--priority-high); }
  .history-block.open .label { color: var(--priority-med); }

  .history-copy {
    margin-top: 0.7rem;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
  }
  .history-copy:hover {
    background: var(--accent-soft);
    box-shadow: 0 0 10px var(--border-glow);
  }

  .history-empty {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--text-mute);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }
  .history-empty .big {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    opacity: 0.4;
  }

  /* ---------- Signature ---------- */
  .signature {
    margin-top: 1rem;
    padding: 0.5rem 0.75rem 0 0;
    text-align: right;
    font-family: 'Rajdhani', cursive;
    font-size: 1rem;
    font-style: italic;
    letter-spacing: 1px;
    color: var(--text-dim);
    opacity: 0.7;
    text-transform: uppercase;
  }
  .signature::before {
    content: "— ";
    font-style: normal;
    color: var(--text-mute);
  }

  .hidden { display: none !important; }
</style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">☑️</span>
        <span>Catcher</span>
      </div>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <div class="view-tabs">
      <button class="view-tab active" id="tabToday" type="button">Today</button>
      <button class="view-tab" id="tabHistory" type="button">History</button>
    </div>

    <div id="todayView">
      <div class="date-label" id="dateLabel"></div>

      <div class="freq-tabs">
        <button class="freq-tab active" data-freq="daily" type="button">
          Daily<span class="count" id="tabCountDaily">0/0</span>
        </button>
        <button class="freq-tab" data-freq="weekly" type="button">
          Weekly<span class="count" id="tabCountWeekly">0/0</span>
        </button>
        <button class="freq-tab" data-freq="monthly" type="button">
          Monthly<span class="count" id="tabCountMonthly">0/0</span>
        </button>
      </div>

      <section class="section">
        <div class="section-head">
          <div class="section-title" id="sectionTitle">Daily</div>
          <div class="section-progress" id="sectionProgress">0 / 0</div>
        </div>
        <div id="taskList"></div>

        <div class="add-form">
          <input type="text" id="taskInput" placeholder="Add a duty..." maxlength="120" autocomplete="off">
          <div class="add-actions">
            <button class="add-submit" id="addBtn" type="button">+ Add</button>
          </div>
        </div>
      </section>

      <button class="end-day-btn" id="endDayBtn" type="button">
        🌙 End Day — Save Record
      </button>
    </div>

    <div id="historyView" class="hidden">
      <div id="historyList"></div>
    </div>

    <div class="signature">Vuja Tsoaela</div>
  </div>

  <script>
  (function () {
    "use strict";

    var KEY_RESP = "dc_responsibilities";
    var KEY_DONE = "dc_done";
    var KEY_HISTORY = "dc_history";
    var KEY_THEME = "dc_theme";

    var responsibilities = loadJSON(KEY_RESP, []);
    var doneMap = loadJSON(KEY_DONE, {});
    var history = loadJSON(KEY_HISTORY, []);
    var theme = loadString(KEY_THEME, "light");
    var activeFreq = "daily";

    var themeToggle = document.getElementById("themeToggle");
    var tabToday = document.getElementById("tabToday");
    var tabHistory = document.getElementById("tabHistory");
    var todayView = document.getElementById("todayView");
    var historyView = document.getElementById("historyView");
    var dateLabel = document.getElementById("dateLabel");
    var endDayBtn = document.getElementById("endDayBtn");
    var historyList = document.getElementById("historyList");

    var taskList = document.getElementById("taskList");
    var taskInput = document.getElementById("taskInput");
    var addBtn = document.getElementById("addBtn");
    var sectionTitle = document.getElementById("sectionTitle");
    var sectionProgress = document.getElementById("sectionProgress");

    var freqTabs = document.querySelectorAll(".freq-tab");

    function loadJSON(key, fallback) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return fallback;
        var v = JSON.parse(raw);
        return v === null || v === undefined ? fallback : v;
      } catch (e) { return fallback; }
    }
    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function loadString(key, fallback) {
      try {
        var v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) { return fallback; }
    }
    function saveString(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (e) {}
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function pad(n) { return String(n).padStart(2, "0"); }

    function periodKey(freq) {
      var d = new Date();
      if (freq === "daily") {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }
      if (freq === "weekly") {
        var days = Math.floor(d.getTime() / 86400000);
        var weekNo = Math.floor((days + 4) / 7);
        return "W" + weekNo;
      }
      return d.getFullYear() + "-" + pad(d.getMonth() + 1);
    }

    function todayLong() {
      var d = new Date();
      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
    }

    function getDoneArr(freq) {
      var pk = periodKey(freq);
      if (!doneMap[freq]) doneMap[freq] = {};
      if (!doneMap[freq][pk]) doneMap[freq][pk] = [];
      return doneMap[freq][pk];
    }
    function isDone(freq, id) {
      return getDoneArr(freq).indexOf(id) !== -1;
    }
    function setDone(freq, id, state) {
      var arr = getDoneArr(freq);
      var idx = arr.indexOf(id);
      if (state && idx === -1) arr.push(id);
      if (!state && idx !== -1) arr.splice(idx, 1);
      saveJSON(KEY_DONE, doneMap);
    }

    function renderFreqTabs() {
      ["daily","weekly","monthly"].forEach(function (f) {
        var items = responsibilities.filter(function (r) { return r.freq === f; });
        var doneCount = items.filter(function (r) { return isDone(f, r.id); }).length;
        var el = document.getElementById("tabCount" + f.charAt(0).toUpperCase() + f.slice(1));
        el.textContent = doneCount + "/" + items.length;
      });
    }

    function renderSection() {
      var freq = activeFreq;
      var items = responsibilities.filter(function (r) { return r.freq === freq; });

      var titles = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" };
      sectionTitle.textContent = titles[freq];

      var doneCount = items.filter(function (r) { return isDone(freq, r.id); }).length;
      sectionProgress.textContent = doneCount + " / " + items.length;
      sectionProgress.classList.toggle("zero", doneCount === 0);

      if (items.length === 0) {
        taskList.innerHTML =
          '<div class="empty-state">' +
            '<div class="big">📋</div>' +
            '<div>No ' + freq + ' duties yet.</div>' +
          '</div>';
        return;
      }

      var html = "";
      items.forEach(function (r) {
        var done = isDone(freq, r.id);
        html +=
          '<div class="task' + (done ? " done" : "") + '" data-id="' + escapeHtml(r.id) + '">' +
            '<button class="task-check" type="button" aria-label="Toggle done">✓</button>' +
            '<div class="task-body">' +
              '<div class="task-text">' + escapeHtml(r.text) + '</div>' +
            '</div>' +
            '<button class="task-delete" type="button" aria-label="Delete duty">×</button>' +
          '</div>';
      });
      taskList.innerHTML = html;

      Array.prototype.forEach.call(taskList.querySelectorAll(".task-check"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.closest(".task").getAttribute("data-id");
          setDone(freq, id, !isDone(freq, id));
          renderAll();
        });
      });
      Array.prototype.forEach.call(taskList.querySelectorAll(".task-delete"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.closest(".task").getAttribute("data-id");
          responsibilities = responsibilities.filter(function (r) { return r.id !== id; });
          saveJSON(KEY_RESP, responsibilities);
          Object.keys(doneMap).forEach(function (f) {
            Object.keys(doneMap[f]).forEach(function (pk) {
              var arr = doneMap[f][pk];
              var i = arr.indexOf(id);
              if (i !== -1) arr.splice(i, 1);
            });
          });
          saveJSON(KEY_DONE, doneMap);
          renderAll();
        });
      });
    }

    function renderAll() {
      renderFreqTabs();
      renderSection();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML =
          '<div class="history-empty">' +
            '<div class="big">📖</div>' +
            '<div>No records yet.</div>' +
            '<div style="margin-top:6px;font-size:0.78rem;">Tap "End Day" to save your first record.</div>' +
          '</div>';
        return;
      }

      var html = "";
      history.forEach(function (rec) {
        html += '<div class="history-item">';
        html += '<div class="history-date">' + escapeHtml(rec.dateLabel) + '</div>';
        html += '<div class="history-summary">' +
                  rec.done.length + ' completed · ' +
                  rec.missed.length + ' missed · ' +
                  rec.open.length + ' still open' +
                '</div>';

        if (rec.done.length) {
          html += '<div class="history-block done"><span class="label">Completed</span><ul>' +
                    rec.done.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") +
                  '</ul></div>';
        }
        if (rec.missed.length) {
          html += '<div class="history-block missed"><span class="label">Missed</span><ul>' +
                    rec.missed.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") +
                  '</ul></div>';
        }
        if (rec.open.length) {
          html += '<div class="history-block open"><span class="label">Still Open</span><ul>' +
                    rec.open.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") +
                  '</ul></div>';
        }

        html += '<button class="history-copy" data-copy="' + escapeHtml(rec.id) + '" type="button">Copy record</button>';
        html += '</div>';
      });

      historyList.innerHTML = html;

      Array.prototype.forEach.call(historyList.querySelectorAll("[data-copy]"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-copy");
          var rec = history.filter(function (r) { return r.id === id; })[0];
          if (!rec) return;
          copyText(buildTextRecord(rec), btn);
        });
      });
    }

    function copyText(text, btn) {
      var done = function () {
        var old = btn.textContent;
        btn.textContent = "Copied ✓";
        setTimeout(function () { btn.textContent = old; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text); done();
        });
      } else {
        fallbackCopy(text); done();
      }
    }
    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    function buildTextRecord(rec) {
      var lines = [];
      lines.push("Work Record — " + rec.dateLabel);
      lines.push("");
      if (rec.done.length) {
        lines.push("Completed:");
        rec.done.forEach(function (t) { lines.push("  ✓ " + t); });
        lines.push("");
      }
      if (rec.missed.length) {
        lines.push("Missed:");
        rec.missed.forEach(function (t) { lines.push("  ✗ " + t); });
        lines.push("");
      }
      if (rec.open.length) {
        lines.push("Still open (weekly/monthly):");
        rec.open.forEach(function (t) { lines.push("  → " + t); });
      }
      return lines.join("\n");
    }

    function addResponsibility() {
      var text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      responsibilities.push({
        id: "r_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        text: text,
        freq: activeFreq,
        created: Date.now()
      });
      saveJSON(KEY_RESP, responsibilities);
      taskInput.value = "";
      taskInput.focus();
      renderAll();
    }

    function endDay() {
      var done = [];
      var missed = [];
      var open = [];

      responsibilities.filter(function (r) { return r.freq === "daily"; }).forEach(function (r) {
        if (isDone("daily", r.id)) done.push(r.text);
        else missed.push(r.text);
      });

      ["weekly","monthly"].forEach(function (freq) {
        responsibilities.filter(function (r) { return r.freq === freq; }).forEach(function (r) {
          if (isDone(freq, r.id)) {
            done.push(r.text + " (" + freq + ")");
          } else {
            open.push(r.text + " (" + freq + ")");
          }
        });
      });

      if (done.length === 0 && missed.length === 0 && open.length === 0) {
        alert("Nothing to record yet. Add some duties first.");
        return;
      }

      var record = {
        id: "rec_" + Date.now(),
        dateLabel: todayLong(),
        done: done,
        missed: missed,
        open: open,
        saved: Date.now()
      };

      history.unshift(record);
      history = history.slice(0, 365);
      saveJSON(KEY_HISTORY, history);

      setTab("history");
      renderHistory();
    }

    function setTab(which) {
      if (which === "today") {
        tabToday.classList.add("active");
        tabHistory.classList.remove("active");
        todayView.classList.remove("hidden");
        historyView.classList.add("hidden");
      } else {
        tabHistory.classList.add("active");
        tabToday.classList.remove("active");
        todayView.classList.add("hidden");
        historyView.classList.remove("hidden");
        renderHistory();
      }
    }

    function setFreq(freq) {
      activeFreq = freq;
      Array.prototype.forEach.call(freqTabs, function (t) {
        t.classList.toggle("active", t.getAttribute("data-freq") === freq);
      });
      renderSection();
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0e1a" : "#f0f4f8");
    }
    function toggleTheme() {
      theme = theme === "dark" ? "light" : "dark";
      saveString(KEY_THEME, theme);
      applyTheme();
    }

    themeToggle.addEventListener("click", toggleTheme);
    tabToday.addEventListener("click", function () { setTab("today"); });
    tabHistory.addEventListener("click", function () { setTab("history"); });
    endDayBtn.addEventListener("click", endDay);
    addBtn.addEventListener("click", addResponsibility);

    taskInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addResponsibility();
    });

    Array.prototype.forEach.call(freqTabs, function (t) {
      t.addEventListener("click", function () {
        setFreq(t.getAttribute("data-freq"));
      });
    });

    dateLabel.textContent = todayLong();
    applyTheme();
    renderAll();
    renderHistory();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  })();
  </script>
</body>
</html>
