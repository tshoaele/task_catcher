<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="A simple daily work responsibility recorder">
<title>Catcher</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
  (function () {
    try {
      var t = localStorage.getItem("dc_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<style>
  :root {
    --bg-1: #f0f4f8;
    --bg-2: #e2e8f0;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --border: #dbe3ec;
    --border-soft: rgba(15, 23, 42, 0.05);
    --text: #0f172a;
    --text-dim: #64748b;
    --text-mute: #94a3b8;
    --accent: #06b6d4;
    --accent-deep: #0891b2;
    --accent-soft: #cffafe;
    --priority-high: #ef4444;
    --priority-med: #f59e0b;
    --priority-low: #10b981;
    --success: #10b981;
    --shadow-card: 0 6px 24px -8px rgba(15, 23, 42, 0.1);
    --shadow-pill: 0 2px 8px rgba(15, 23, 42, 0.06);
  }

  [data-theme="dark"] {
    --bg-1: #0a0e1a;
    --bg-2: #050810;
    --surface: #141c2e;
    --surface-soft: #0f1626;
    --border: #1e2a44;
    --border-soft: rgba(255, 255, 255, 0.05);
    --text: #e8f0ff;
    --text-dim: #8ba3c7;
    --text-mute: #566a8a;
    --accent: #22d3ee;
    --accent-deep: #0891b2;
    --accent-soft: #0e2a3a;
    --priority-high: #f87171;
    --priority-med: #fbbf24;
    --priority-low: #34d399;
    --success: #34d399;
    --shadow-card: 0 6px 24px -8px rgba(0, 0, 0, 0.6);
    --shadow-pill: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1rem;
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 90vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding: 0 0.25rem;
    gap: 0.5rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    color: #fff;
    font-size: 1.15rem;
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
    flex-shrink: 0;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .theme-toggle {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.05rem;
    transition: 0.15s;
    font-family: inherit;
    padding: 0;
    box-shadow: var(--shadow-pill);
    line-height: 1;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle:active { transform: scale(0.94); }

  .view-tabs {
    display: flex;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 4px;
    margin-bottom: 0.9rem;
  }
  .view-tab {
    flex: 1;
    padding: 0.7rem 0.5rem;
    border: none;
    background: transparent;
    border-radius: 0.75rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }
  .view-tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-pill);
  }

  .freq-tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.9rem;
  }
  .freq-tab {
    flex: 1;
    padding: 0.65rem 0.4rem;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 0.9rem;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
    letter-spacing: 0.3px;
  }
  .freq-tab.active {
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
  }
  .freq-tab .count {
    display: block;
    font-size: 0.68rem;
    font-weight: 600;
    opacity: 0.85;
    margin-top: 2px;
    letter-spacing: 0;
  }

  .date-label {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 0.9rem;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 1.5rem;
    padding: 0.75rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-card);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.5rem 0.6rem;
    gap: 0.5rem;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .section-progress {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  .section-progress.zero { color: var(--text-mute); }

  .task {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.6rem;
    border-top: 1px solid var(--border-soft);
  }
  .task:first-of-type { border-top: none; }

  .task-check {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface-soft);
    cursor: pointer;
    transition: 0.2s;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 0.85rem;
    font-weight: 900;
  }
  .task.done .task-check {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
  }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
    transition: 0.2s;
  }
  .task.done .task-text {
    color: var(--text-mute);
    text-decoration: line-through;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 0.68rem;
    color: var(--text-dim);
    font-weight: 600;
    flex-wrap: wrap;
  }

  .day-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-radius: 30px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  [data-theme="dark"] .day-chip { color: var(--accent); }

  .task-delete {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-mute);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-family: inherit;
    padding: 0;
  }
  .task-delete:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .empty-state {
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--text-mute);
    font-size: 0.85rem;
  }
  .empty-state .big {
    font-size: 1.6rem;
    margin-bottom: 0.4rem;
    opacity: 0.5;
  }

  .add-form {
    border-top: 1px solid var(--border-soft);
    padding: 0.7rem 0.4rem 0.3rem;
  }

  .add-form input[type="text"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: var(--surface-soft);
    border: 2px solid var(--border);
    border-radius: 0.8rem;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    outline: none;
    margin-bottom: 0.55rem;
  }
  .add-form input[type="text"]:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
  }
  .add-form input[type="text"]::placeholder { color: var(--text-mute); }

  .day-picker {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-bottom: 0.55rem;
    align-items: center;
  }

  .day-btn {
    padding: 0.5rem 0.7rem;
    border-radius: 0.6rem;
    border: 1.5px solid var(--border);
    background: var(--surface-soft);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.12s;
    letter-spacing: 0.2px;
    min-width: 42px;
    min-height: 38px;
    line-height: 1;
  }
  .day-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(6, 182, 212, 0.35);
  }
  .day-btn.every {
    padding: 0.5rem 0.85rem;
    min-width: auto;
  }

  .day-summary {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .day-summary strong {
    color: var(--accent);
    font-weight: 800;
  }

  .add-actions {
    display: flex;
    justify-content: flex-end;
  }
  .add-submit {
    padding: 0.65rem 1.2rem;
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    color: #fff;
    border: none;
    border-radius: 0.75rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    min-height: 42px;
  }
  .add-submit:active { transform: scale(0.97); }

  .end-day-btn {
    width: 100%;
    padding: 1.1rem;
    margin-top: 0.5rem;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    border: none;
    border-radius: 1.2rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: 0.15s;
    box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .end-day-btn:hover { transform: translateY(-1px); }
  .end-day-btn:active { transform: scale(0.98); }
  [data-theme="dark"] .end-day-btn {
    background: linear-gradient(135deg, #22d3ee, #3b82f6);
  }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 1.2rem;
    padding: 1rem 1.1rem;
    margin-bottom: 0.7rem;
    box-shadow: var(--shadow-card);
  }
  .history-date {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.15rem;
  }
  .history-summary {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
    font-weight: 500;
  }
  .history-block {
    font-size: 0.8rem;
    margin-bottom: 0.55rem;
  }
  .history-block:last-child { margin-bottom: 0; }
  .history-block .label {
    display: block;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.25rem;
  }
  .history-block ul {
    margin: 0;
    padding-left: 1.05rem;
  }
  .history-block li {
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.5;
  }
  .history-block.done .label { color: var(--success); }
  .history-block.missed .label { color: var(--priority-high); }
  .history-block.open .label { color: var(--priority-med); }

  .history-copy {
    margin-top: 0.7rem;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 8px;
    border-radius: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .history-copy:hover { background: var(--accent-soft); }

  .history-empty {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--text-mute);
    font-size: 0.85rem;
  }
  .history-empty .big {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    opacity: 0.4;
  }

  .signature {
    margin-top: 1rem;
    padding: 0.5rem 0.75rem 0 0;
    text-align: right;
    font-family: "Brush Script MT", "Segoe Script", "Dancing Script", cursive;
    font-size: 1.15rem;
    font-style: italic;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.75;
  }
  .signature::before {
    content: "— ";
    font-style: normal;
    color: var(--text-mute);
  }

  .hidden { display: none !important; }
</style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">☑️</span>
        <span>Catcher</span>
      </div>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <div class="view-tabs">
      <button class="view-tab active" id="tabToday" type="button">Today</button>
      <button class="view-tab" id="tabHistory" type="button">History</button>
    </div>

    <div id="todayView">
      <div class="date-label" id="dateLabel"></div>

      <div class="freq-tabs">
        <button class="freq-tab active" data-freq="daily" type="button">
          Daily<span class="count" id="tabCountDaily">0/0</span>
        </button>
        <button class="freq-tab" data-freq="weekly" type="button">
          Weekly<span class="count" id="tabCountWeekly">0/0</span>
        </button>
        <button class="freq-tab" data-freq="monthly" type="button">
          Monthly<span class="count" id="tabCountMonthly">0/0</span>
        </button>
      </div>

      <section class="section">
        <div class="section-head">
          <div class="section-title" id="sectionTitle">Daily</div>
          <div class="section-progress" id="sectionProgress">0 / 0</div>
        </div>
        <div id="taskList"></div>

        <div class="add-form">
          <input type="text" id="taskInput" placeholder="Add a duty..." maxlength="120" autocomplete="off">

          <div class="day-picker" id="dayPicker">
            <button class="day-btn every active" data-day="every" type="button">Every day</button>
            <button class="day-btn" data-day="1" type="button">Mon</button>
            <button class="day-btn" data-day="2" type="button">Tue</button>
            <button class="day-btn" data-day="3" type="button">Wed</button>
            <button class="day-btn" data-day="4" type="button">Thu</button>
            <button class="day-btn" data-day="5" type="button">Fri</button>
            <button class="day-btn" data-day="6" type="button">Sat</button>
            <button class="day-btn" data-day="0" type="button">Sun</button>
          </div>

          <div class="day-summary" id="daySummary"></div>

          <div class="add-actions">
            <button class="add-submit" id="addBtn" type="button">+ Add</button>
          </div>
        </div>
      </section>

      <button class="end-day-btn" id="endDayBtn" type="button">
        🌙 End Day — Save Record
      </button>
    </div>

    <div id="historyView" class="hidden">
      <div id="historyList"></div>
    </div>

    <div class="signature">Vuja Tsoaela</div>
  </div>

  <script>
  (function () {
    "use strict";

    var KEY_RESP = "dc_responsibilities";
    var KEY_DONE = "dc_done";
    var KEY_HISTORY = "dc_history";
    var KEY_THEME = "dc_theme";

    var responsibilities = loadJSON(KEY_RESP, []);
    var doneMap = loadJSON(KEY_DONE, {});
    var history = loadJSON(KEY_HISTORY, []);
    var theme = loadString(KEY_THEME, "light");
    var activeFreq = "daily";
    var selectedDays = { every: true, days: [] };

    var themeToggle = document.getElementById("themeToggle");
    var tabToday = document.getElementById("tabToday");
    var tabHistory = document.getElementById("tabHistory");
    var todayView = document.getElementById("todayView");
    var historyView = document.getElementById("historyView");
    var dateLabel = document.getElementById("dateLabel");
    var endDayBtn = document.getElementById("endDayBtn");
    var historyList = document.getElementById("historyList");

    var taskList = document.getElementById("taskList");
    var taskInput = document.getElementById("taskInput");
    var addBtn = document.getElementById("addBtn");
    var sectionTitle = document.getElementById("sectionTitle");
    var sectionProgress = document.getElementById("sectionProgress");
    var dayPicker = document.getElementById("dayPicker");
    var daySummary = document.getElementById("daySummary");

    var tabCountDaily = document.getElementById("tabCountDaily");
    var tabCountWeekly = document.getElementById("tabCountWeekly");
    var tabCountMonthly = document.getElementById("tabCountMonthly");

    var freqTabs = document.querySelectorAll(".freq-tab");
    var dayBtns = dayPicker.querySelectorAll(".day-btn");

    var DAY_MAP = { "0":"Sun","1":"Mon","2":"Tue","3":"Wed","4":"Thu","5":"Fri","6":"Sat" };

    /* ---------- Helpers ---------- */
    function loadJSON(key, fallback) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return fallback;
        var v = JSON.parse(raw);
        return v === null || v === undefined ? fallback : v;
      } catch (e) { return fallback; }
    }
    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function loadString(key, fallback) {
      try {
        var v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) { return fallback; }
    }
    function saveString(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (e) {}
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function pad(n) { return String(n).padStart(2, "0"); }

    /* ---------- Period keys (hour-safe) ---------- */
    function periodKey(freq) {
      var d = new Date();
      if (freq === "daily") {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }
      if (freq === "weekly") {
        var days = Math.floor(d.getTime() / 86400000);
        var weekNo = Math.floor((days + 4) / 7);
        return "W" + weekNo;
      }
      return d.getFullYear() + "-" + pad(d.getMonth() + 1);
    }

    function todayLong() {
      var d = new Date();
      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
    }

    function isApplicableOnToday(r) {
      if (r.freq !== "daily") return true;
      if (!r.days || r.days.length === 0 || r.days.indexOf("every") !== -1) return true;
      var today = String(new Date().getDay());
      return r.days.indexOf(today) !== -1;
    }

    /* ---------- Done tracking ---------- */
    function getDoneArr(freq) {
      var pk = periodKey(freq);
      if (!doneMap[freq]) doneMap[freq] = {};
      if (!doneMap[freq][pk]) doneMap[freq][pk] = [];
      return doneMap[freq][pk];
    }
    function isDone(freq, id) {
      return getDoneArr(freq).indexOf(id) !== -1;
    }
    function setDone(freq, id, state) {
      var arr = getDoneArr(freq);
      var idx = arr.indexOf(id);
      if (state && idx === -1) arr.push(id);
      if (!state && idx !== -1) arr.splice(idx, 1);
      saveJSON(KEY_DONE, doneMap);
    }

    /* ---------- Day picker UI ---------- */
    function updateDayPickerUI() {
      dayBtns.forEach(function (btn) {
        var d = btn.getAttribute("data-day");
        var isActive;
        if (d === "every") {
          isActive = selectedDays.every;
        } else {
          isActive = !selectedDays.every && selectedDays.days.indexOf(d) !== -1;
        }
        btn.classList.toggle("active", isActive);
      });
      updateDaySummary();
    }

    function updateDaySummary() {
      if (activeFreq !== "daily") {
        daySummary.style.display = "none";
        return;
      }
      daySummary.style.display = "block";
      if (selectedDays.every) {
        daySummary.innerHTML = 'Saving as: <strong>Every day</strong>';
      } else if (selectedDays.days.length === 0) {
        daySummary.innerHTML = 'Saving as: <strong>nothing selected</strong>';
      } else {
        var names = selectedDays.days.map(function (d) { return DAY_MAP[d] || d; });
        daySummary.innerHTML = 'Saving as: <strong>' + escapeHtml(names.join(", ")) + '</strong>';
      }
    }

    dayBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var d = btn.getAttribute("data-day");
        if (d === "every") {
          selectedDays.every = true;
          selectedDays.days = [];
        } else {
          selectedDays.every = false;
          var i = selectedDays.days.indexOf(d);
          if (i === -1) selectedDays.days.push(d);
          else selectedDays.days.splice(i, 1);
        }
        updateDayPickerUI();
      });
    });

    /* ---------- Render ---------- */
    function renderFreqTabs() {
      ["daily","weekly","monthly"].forEach(function (f) {
        var items = responsibilities.filter(function (r) {
          if (r.freq !== f) return false;
          if (f === "daily") return isApplicableOnToday(r);
          return true;
        });
        var doneCount = items.filter(function (r) { return isDone(f, r.id); }).length;
        var el = document.getElementById("tabCount" + f.charAt(0).toUpperCase() + f.slice(1));
        el.textContent = doneCount + "/" + items.length;
      });
    }

    function renderSection() {
      var freq = activeFreq;
      var items = responsibilities.filter(function (r) {
        if (r.freq !== freq) return false;
        if (freq === "daily") return isApplicableOnToday(r);
        return true;
      });

      var titles = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" };
      sectionTitle.textContent = titles[freq];

      var doneCount = items.filter(function (r) { return isDone(freq, r.id); }).length;
      sectionProgress.textContent = doneCount + " / " + items.length;
      sectionProgress.classList.toggle("zero", doneCount === 0);

      dayPicker.style.display = freq === "daily" ? "flex" : "none";
      updateDaySummary();

      if (items.length === 0) {
        var msg = freq === "daily"
          ? "No duties scheduled for today."
          : "No " + freq + " duties yet.";
        taskList.innerHTML =
          '<div class="empty-state">' +
            '<div class="big">📋</div>' +
            '<div>' + msg + '</div>' +
          '</div>';
        return;
      }

      var html = "";
      items.forEach(function (r) {
        var done = isDone(freq, r.id);
        var dayLabel = "";
        if (freq === "daily") {
          if (!r.days || r.days.length === 0 || r.days.indexOf("every") !== -1) {
            dayLabel = "Every day";
          } else {
            var names = r.days.map(function (d) { return DAY_MAP[d] || d; });
            dayLabel = names.join(", ");
          }
        }
        html +=
          '<div class="task' + (done ? " done" : "") + '" data-id="' + escapeHtml(r.id) + '">' +
            '<button class="task-check" type="button" aria-label="Toggle done">✓</button>' +
            '<div class="task-body">' +
              '<div class="task-text">' + escapeHtml(r.text) + '</div>' +
              (dayLabel ? '<div class="task-meta"><span class="day-chip">' + escapeHtml(dayLabel) + '</span></div>' : '') +
            '</div>' +
            '<button class="task-delete" type="button" aria-label="Delete duty">×</button>' +
          '</div>';
      });
      taskList.innerHTML = html;

      Array.prototype.forEach.call(taskList.querySelectorAll(".task-check"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.closest(".task").getAttribute("data-id");
          setDone(freq, id, !isDone(freq, id));
          renderAll();
        });
      });
      Array.prototype.forEach.call(taskList.querySelectorAll(".task-delete"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.closest(".task").getAttribute("data-id");
          responsibilities = responsibilities.filter(function (r) { return r.id !== id; });
          saveJSON(KEY_RESP, responsibilities);
          Object.keys(doneMap).forEach(function (f) {
            Object.keys(doneMap[f]).forEach(function (pk) {
              var arr = doneMap[f][pk];
              var i = arr.indexOf(id);
              if (i !== -1) arr.splice(i, 1);
            });
          });
          saveJSON(KEY_DONE, doneMap);
          renderAll();
        });
      });
    }

    function renderAll() {
      renderFreqTabs();
      renderSection();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML =
          '<div class="history-empty">' +
            '<div class="big">📖</div>' +
            '<div>No records yet.</div>' +
            '<div style="margin-top:6px;font-size:0.78rem;">Tap "End Day" to save your first record.</div>' +
          '</div>';
        return;
      }

      var html = "";
      history.forEach(function (rec) {
        html += '<div class="history-item">';
        html += '<div class="history-date">' + escapeHtml(rec.dateLabel) + '</div>';
        html += '<div class="history-summary">' +
                  rec.done.length + ' completed · ' +
                  rec.missed.length + ' missed · ' +
                  rec.open.length + ' still open' +
                '</div>';

        if (rec.done.length) {
          html += '<div class="history-block done"><span class="label">Completed</span><ul>' +
                    rec.done.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") +
                  '</ul></div>';
        }
        if (rec.missed.length) {
          html += '<div class="history-block missed"><span class="label">Missed</span><ul>' +
                    rec.missed.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") +
                  '</ul></div>';
        }
        if (rec.open.length) {
          html += '<div class="history-block open"><span class="label">Still Open</span><ul>' +
                    rec.open.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") +
                  '</ul></div>';
        }

        html += '<button class="history-copy" data-copy="' + escapeHtml(rec.id) + '" type="button">Copy record</button>';
        html += '</div>';
      });

      historyList.innerHTML = html;

      Array.prototype.forEach.call(historyList.querySelectorAll("[data-copy]"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-copy");
          var rec = history.filter(function (r) { return r.id === id; })[0];
          if (!rec) return;
          copyText(buildTextRecord(rec), btn);
        });
      });
    }

    function copyText(text, btn) {
      var done = function () {
        var old = btn.textContent;
        btn.textContent = "Copied ✓";
        setTimeout(function () { btn.textContent = old; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text); done();
        });
      } else {
        fallbackCopy(text); done();
      }
    }
    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    function buildTextRecord(rec) {
      var lines = [];
      lines.push("Work Record — " + rec.dateLabel);
      lines.push("");
      if (rec.done.length) {
        lines.push("Completed:");
        rec.done.forEach(function (t) { lines.push("  ✓ " + t); });
        lines.push("");
      }
      if (rec.missed.length) {
        lines.push("Missed:");
        rec.missed.forEach(function (t) { lines.push("  ✗ " + t); });
        lines.push("");
      }
      if (rec.open.length) {
        lines.push("Still open (weekly/monthly):");
        rec.open.forEach(function (t) { lines.push("  → " + t); });
      }
      return lines.join("\n");
    }

    /* ---------- Add ---------- */
    function addResponsibility() {
      var text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      var days = [];
      if (activeFreq === "daily") {
        if (selectedDays.every) {
          days = ["every"];
        } else if (selectedDays.days.length === 0) {
          alert("Pick at least one day, or tap 'Every day'.");
          return;
        } else {
          days = selectedDays.days.slice();
        }
      }

      responsibilities.push({
        id: "r_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        text: text,
        freq: activeFreq,
        days: days,
        created: Date.now()
      });
      saveJSON(KEY_RESP, responsibilities);
      taskInput.value = "";
      taskInput.focus();
      renderAll();
    }

    /* ---------- End day ---------- */
    function endDay() {
      var done = [];
      var missed = [];
      var open = [];

      responsibilities.filter(function (r) {
        return r.freq === "daily" && isApplicableOnToday(r);
      }).forEach(function (r) {
        if (isDone("daily", r.id)) done.push(r.text);
        else missed.push(r.text);
      });

      ["weekly","monthly"].forEach(function (freq) {
        responsibilities.filter(function (r) { return r.freq === freq; }).forEach(function (r) {
          if (isDone(freq, r.id)) {
            done.push(r.text + " (" + freq + ")");
          } else {
            open.push(r.text + " (" + freq + ")");
          }
        });
      });

      if (done.length === 0 && missed.length === 0 && open.length === 0) {
        alert("Nothing to record yet. Add some duties first.");
        return;
      }

      var record = {
        id: "rec_" + Date.now(),
        dateLabel: todayLong(),
        done: done,
        missed: missed,
        open: open,
        saved: Date.now()
      };

      history.unshift(record);
      history = history.slice(0, 365);
      saveJSON(KEY_HISTORY, history);

      setTab("history");
      renderHistory();
    }

    /* ---------- Tabs ---------- */
    function setTab(which) {
      if (which === "today") {
        tabToday.classList.add("active");
        tabHistory.classList.remove("active");
        todayView.classList.remove("hidden");
        historyView.classList.add("hidden");
      } else {
        tabHistory.classList.add("active");
        tabToday.classList.remove("active");
        todayView.classList.add("hidden");
        historyView.classList.remove("hidden");
        renderHistory();
      }
    }

    function setFreq(freq) {
      activeFreq = freq;
      Array.prototype.forEach.call(freqTabs, function (t) {
        t.classList.toggle("active", t.getAttribute("data-freq") === freq);
      });
      renderSection();
    }

    /* ---------- Theme ---------- */
    function applyTheme() {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0e1a" : "#f0f4f8");
    }
    function toggleTheme() {
      theme = theme === "dark" ? "light" : "dark";
      saveString(KEY_THEME, theme);
      applyTheme();
    }

    /* ---------- Events ---------- */
    themeToggle.addEventListener("click", toggleTheme);
    tabToday.addEventListener("click", function () { setTab("today"); });
    tabHistory.addEventListener("click", function () { setTab("history"); });
    endDayBtn.addEventListener("click", endDay);
    addBtn.addEventListener("click", addResponsibility);

    taskInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addResponsibility();
    });

    Array.prototype.forEach.call(freqTabs, function (t) {
      t.addEventListener("click", function () {
        setFreq(t.getAttribute("data-freq"));
      });
    });

    /* ---------- Init ---------- */
    dateLabel.textContent = todayLong();
    applyTheme();
    updateDayPickerUI();
    renderAll();
    renderHistory();
  })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
